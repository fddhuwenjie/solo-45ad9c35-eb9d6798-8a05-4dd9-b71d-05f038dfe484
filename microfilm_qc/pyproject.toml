[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microfilm-qc"
version = "1.0.0"
description = "微缩胶片扫描卷盘质检工作台（Flask + SQLite + Pillow，原生 JavaScript 前端）"
requires-python = ">=3.10,<3.13"
dependencies = [
    "Flask>=3.1,<3.2",
    "Pillow>=12.0,<13.0",
]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["qc_core*"]
